<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tablero Cobranza Calendario</title>
<style>
/* Diseño según Plantilla_Tableros_Finanzas: fondo blanco, Arial, azul marino / rojo / azul medio, tarjetas con sombra suave. Pestañas: Resumen, Empresas, Mes a mes, Calendario de cobranza, Pendientes y acciones. */
:root{
  color-scheme:light;
  --navy:#0B1F3A; --red:#E4222E; --blue:#1F4E9C;
  --plane:#F4F6FA; --surface:#ffffff; --ink:#0B1F3A; --ink2:#3d4c66; --muted:#66748c;
  --grid:#e6eaf1; --axis:#c5cddb; --ring:rgba(11,31,58,.12); --wash:rgba(11,31,58,.05); --wash2:rgba(11,31,58,.10);
  --seza:#3065af; --ship:#EA6175; --gsg:#212E49; --seza-b:#4a9de8; --ship-b:#ff7a93; --gsg-b:#212E49;
  --c0:#94ccfbe4; --c1:#ffb547; --c2:#ff7a93; --c3:#4cc9a0; --c4:#8b7ce0; --c5:#9fb0c8;
  --noer:#c5cddb; --good:#2E7D32; --crit:#D32F2F; --warn:#9a6300; --focus:#1F4E9C;
  --shadow:0 2px 10px rgba(11,31,58,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--plane);color:var(--ink);font:14px/1.45 Arial,Helvetica,sans-serif;padding-inline:16px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1280px;margin-inline:auto;padding-block:16px 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;padding-block:0 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--grid);box-shadow:var(--shadow)}
.bar3{display:flex;height:6px;margin-inline:-16px}.bar3 i{display:block;flex:1}.bar3 i:nth-child(1){background:var(--navy)}.bar3 i:nth-child(2){background:var(--red)}.bar3 i:nth-child(3){background:var(--navy)}
.toprow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;margin-top:10px}
.logos{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.logos img{height:30px;width:auto;display:block}.logos img.l-ship{height:26px}.logos img.l-gsg{height:40px}.foot img{height:26px;width:auto;display:block}
.wm{font-weight:700;letter-spacing:.06em;font-size:20px;line-height:1}.wm.a{color:var(--seza)}.wm.b{color:var(--ship)}.wm.c{color:var(--gsg)}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--navy)}
.brand h1{font-size:24px;line-height:1.2;margin:2px 0 0;font-weight:700;color:var(--navy)}
.brand h1::after{content:"";display:block;width:44px;height:3px;background:var(--red);margin-top:5px;border-radius:2px}
.brand .sub{display:block;color:var(--blue);font-size:12.5px;margin-top:6px}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:10px}
.fgroup{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.flabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;background:var(--wash);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.seg button:hover{background:var(--wash2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:0 0 0 1px var(--ring);font-weight:600}
.seg button.emp .dot{width:10px;height:10px;background:var(--co)}
.seg button.emp[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px var(--co)}
.seg button.emp.g[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:0 0 0 1px var(--ring)}
.seg button.emp:hover{background:var(--wash2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:700;font-size:11px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;margin-bottom:-11px;scrollbar-width:thin}
nav.tabs button{border:0;background:transparent;padding:8px 14px 9px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--red);border-bottom-width:3px;font-weight:700}
main{margin-top:22px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media(max-width:940px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.03em}
.card .hint{color:var(--ink2);font-size:12.5px;margin-top:2px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.tbtn{border:1px solid var(--ring);background:transparent;border-radius:6px;padding:2px 8px;font-size:12px;color:var(--ink2);flex:none}
.tbtn:hover{background:var(--wash)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:6px;font-size:12px;color:var(--ink2)}
.legend i.bx{display:inline-block;height:10px;width:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
svg text{font:11px Arial,Helvetica,sans-serif;fill:var(--muted)}
svg text.v{fill:var(--ink2)}svg text.tt{fill:var(--navy);font-weight:700}
svg .gl{stroke:var(--grid);stroke-width:1}
svg .ax{stroke:var(--axis);stroke-width:1}
svg .hit{fill:transparent}svg .hit:hover,svg .hit:focus{fill:var(--wash);outline:none}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--ring);border-top:5px solid var(--navy);border-radius:14px;padding:14px 14px 10px;min-width:0;box-shadow:var(--shadow)}
.kpi .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);font-weight:700}
.kpi .n{font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.02em;margin-top:4px;white-space:nowrap}
@media(max-width:640px){.kpi .n{font-size:21px}}
.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:2px;min-height:18px}
.kpi svg{margin-top:6px;height:42px;width:132px;max-width:100%;display:block}
.kpi.t-fact{border-top-color:#1565c0}.kpi.t-fact .k{color:#1565c0}
.kpi.t-gast{border-top-color:#e64a19}.kpi.t-gast .k{color:#e64a19}
.kpi.t-marg{border-top-color:#afb42b}.kpi.t-marg .k{color:#7c7f14}
.kpi.t-ub{border-top-color:#81c784}.kpi.t-ub .k{color:#2e7d32}
.kpi.t-uai{border-top-color:#43a047}.kpi.t-uai .k{color:#2e7d32}
.kpi.t-un{border-top-color:#2e7d32}.kpi.t-un .k{color:#2e7d32}
.kpi.aside{border-style:dashed;border-top-style:solid}
.mb1{fill:#90caf9}.mb-un{fill:#66bb6a}.mb-uai{fill:#81c784}.mb-marg{fill:#d4d88a}.mb-gast{fill:#ffab91}.mb-navy{fill:var(--axis)}
.delta{font-weight:600}.delta.up{color:var(--good)}.delta.dn{color:var(--crit)}.delta.flat{color:var(--ink2)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;font-weight:700;color:#fff;letter-spacing:.04em;text-transform:uppercase;background:var(--navy)}
td{border-bottom:1px solid var(--grid)}
tr.sub td{font-weight:700}
tr.click{cursor:pointer}tr.click:hover td{background:var(--wash)}
.tw{overflow-x:auto;max-width:100%}
.mut{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.03em;background:var(--wash);color:var(--ink2)}
.badge.ok{color:var(--good);background:#e6f2e7}.badge.wr{color:var(--warn);background:#fdf1dc}.badge.er{color:var(--crit);background:#fbe6e6}
.note{border-left:3px solid var(--warn);background:var(--wash);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--ink2)}
.note.ok{border-left-color:var(--good)}.note.er{border-left-color:var(--crit)}.note.in{border-left-color:var(--navy)}
.notes{display:grid;gap:10px}
.rk{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:10px;align-items:center;padding-block:5px;font-size:13px}
.rk .tr{height:12px;background:var(--grid);border-radius:4px;overflow:hidden}.rk .tr b{display:block;height:100%;border-radius:4px}
.rk .v{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink2);text-align:right}
.ecards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.ecard{text-align:left;background:var(--surface);border:1px solid var(--ring);border-top:5px solid var(--co);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.ecard:hover{background:var(--wash)}
.ecard .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--co)}
.ecard .n{font-size:24px;font-weight:700;color:var(--navy)}
.ecard .s{font-size:12.5px;color:var(--ink2)}
.foot{margin-top:28px;padding:14px 18px;background:var(--navy);border-radius:14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;color:#fff;font-size:12px}
.foot .fl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.foot .fb{background:#fff;border-radius:8px;padding:6px 12px}.foot .fb .wm{font-size:16px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--ring);box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:8px;padding:8px 10px;font-size:12.5px;max-width:300px;opacity:0;transition:opacity .08s}
#tip b{display:block;margin-bottom:4px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;align-items:center}
#tip .tr span:first-child{color:var(--ink2);display:flex;align-items:center;gap:6px}
#tip .tr i{display:inline-block;width:10px;height:10px;border-radius:2px}
#tip .tr span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted)}
tr.click[aria-selected="true"] td{background:var(--wash2)}
tr.click td:first-child{white-space:nowrap}
#drill{scroll-margin-top:200px}
.dtools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:10px}
.dtools .fld{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
input[type=search],select{background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 10px;min-width:0;max-width:100%}
.ghost{border:1px solid var(--ring);background:var(--surface);border-radius:8px;padding:5px 10px;color:var(--ink2)}.ghost:hover{background:var(--wash)}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px;color:var(--ink2)}
.tw.tall{max-height:520px;overflow:auto}.tw.tall th{position:sticky;top:0}
td.wr{white-space:normal;min-width:200px}
.badge.in{color:var(--navy);background:#e4e9f2}.badge .sd{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
input[type=number],input[type=date]{background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 8px;min-width:0}
.semp{background:var(--wash);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.semp .t{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--navy);margin-bottom:6px}
.tw.tall th{white-space:normal;line-height:1.2;vertical-align:bottom}.tw.tall td{font-size:13px}
.sfc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sfc button{border:1px solid var(--ring);background:var(--surface);border-radius:10px;padding:6px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink2)}
.sfc button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--navy)}
.sfc button b{font-size:15px;color:var(--navy)}
tr.cur td{background:#fff8e6}tr.fut td{color:var(--muted)}
.kpi.t-er{border-top-color:var(--crit)}.kpi.t-er .k{color:var(--crit)}.kpi.t-wr{border-top-color:#e8a317}.kpi.t-wr .k{color:var(--warn)}.kpi.t-ok{border-top-color:var(--good)}.kpi.t-ok .k{color:var(--good)}.kpi.t-in{border-top-color:var(--navy)}
@media(max-width:640px){.dtools .fld{flex:1 1 100%;flex-wrap:wrap}.dtools .fld select,.dtools .fld input{flex:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 h+='<div class="tw tall"><table><tr>'+[['Folio',4],['Fecha',5],['Cliente',6],['Empresa',0],['Importe (subtotal)',7],['Fecha tentativa de pago',10],['Días de atraso',90],['Estatus de pago',3],['Semáforo',91],['Categoría',8]].map(([l,k])=>`<th style="cursor:pointer" tabindex="0" role="button" data-sk="${k}" aria-sort="${st.sort.k===k?(st.sort.dir>0?'ascending':'descending'):'none'}">${l} ${st.sort.k===k?(st.sort.dir>0?'▲':'▼'):'<span style="opacity:.45">↕</span>'}</th>`).join('')+'</tr>'+L.slice(st.page*100,st.page*100+100).map(r=>`<tr><td>${r[4]}</td><td>${r[5]||'–'}</td><td>${r[6]}</td><td>${r[0]}</td><td>${r[9]==='Sí'&&r[7]?money(r[7]):'–'}</td><td>${r[10]?fdate(r[10])+(r[13]==='R'?' <span class="mut" title="Fecha calculada por regla; sin calendario oficial" style="font-size:11px">ref.</span>':''):'–'}</td><td>${(()=>{const a=semRow(r).a;return a==null?'–':num(a)})()}</td><td>${badge(r[3])}</td><td>${semBadge(semRow(r))}</td><td class="wr">${r[8]||'–'}</td></tr>`).join('')+'</table></div>';
 if(pages>1)h+=`<div class="pager"><button class="ghost" type="button" id="dprev"${st.page?'':' disabled'}>‹ Anterior</button><span>Página ${st.page+1} de ${pages}</span><button class="ghost" type="button" id="dnext"${st.page<pages-1?'':' disabled'}>Siguiente ›</button></div>`;
 return h;
}
function wireDrill(){
 const b=$('dbody');if(!b)return;
 const re=()=>{b.innerHTML=drillBody();wireDrill()};
 const c=$('dcat');if(c)c.onchange=()=>{st.cat=c.value;st.page=0;re()};
 const sf=$('dsf');if(sf)sf.onchange=()=>{st.sf=sf.value;st.page=0;re()};
 b.querySelectorAll('[data-sf]').forEach(x=>x.onclick=()=>{st.sf=st.sf===x.dataset.sf?'':x.dataset.sf;st.page=0;re()});
 const q=$('dq');if(q)q.oninput=()=>{st.q=q.value;st.page=0;const p=q.selectionStart;re();const n=$('dq');n.focus();n.setSelectionRange(p,p)};
 b.querySelectorAll('th[data-sk]').forEach(th=>{const go=()=>{const k=+th.dataset.sk;st.sort=st.sort.k===k?{k,dir:-st.sort.dir}:{k,dir:(k===7||k===90)?-1:1};st.page=0;re()};th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
 const cl=$('dclr');if(cl)cl.onclick=()=>{st.q='';st.cat='';st.sf='';st.page=0;st.sort=st.drill==='Pendiente de pago'?{k:91,dir:1}:{k:7,dir:-1};re()};
 const pv=$('dprev');if(pv)pv.onclick=()=>{st.page--;re()};const nx=$('dnext');if(nx)nx.onclick=()=>{st.page++;re()};
 $('dclose').onclick=()=>{st.drill=null;render()};
}

/* ===== Semáforo de cobranza: parámetros en D.cfg (corte por fuente, días próximo a vencer, gracia); editables en pantalla ===== */
const DAY=864e5,tms=iso=>Date.parse(iso+'T00:00:00Z');
const fdate=iso=>iso?iso.split('-').reverse().join('/'):'–';
const maxCorte=()=>Object.values(D.cfg.cortes).sort().pop();
const corteOf=e=>st.sem.mode==='fecha'&&st.sem.fecha?st.sem.fecha:(D.cfg.cortes[e]||maxCorte());
const lateDays=(tent,e)=>Math.round((tms(corteOf(e))-tms(tent))/DAY);
function semPend(tent,e){
 if(!tent)return {k:'in',l:'Sin fecha de pago',a:null,r:3};
 const d=lateDays(tent,e);
 if(d>st.sem.gracia)return {k:'er',l:'Atrasado',a:d,r:0};
 if(-d<=st.sem.prox||d>0)return {k:'wr',l:'Próximo a vencer',a:Math.max(d,0),r:1};
 return {k:'ok',l:'Dentro del plazo',a:0,r:2};
}
function semRow(r){
 if(r[3]==='Pendiente de pago')return semPend(r[10],r[0]);
 if(r[3]==='Por revisar')return {k:'na',l:'Por validar',a:null,r:4};
 return {k:'na',l:'No aplica',a:null,r:5};
}
const semBadge=x=>x.k==='na'?`<span class="badge">${x.l}</span>`:`<span class="badge ${x.k}"><i class="sd"></i>${x.l}</span>`;
const SEMF=[['er','Atrasado'],['wr','Próximo a vencer'],['ok','Dentro del plazo'],['in','Sin fecha de pago']];
function semParams(){
 const s=st.sem;
 return `<div class="semp"><div class="t">Parámetros del semáforo</div><div class="dtools" style="margin:0"><label class="fld"><span class="flabel">Corte para calcular atraso</span><select id="sMode"><option value="fuente"${s.mode==='fuente'?' selected':''}>Corte de cada fuente de pago</option><option value="fecha"${s.mode==='fecha'?' selected':''}>Fecha específica</option></select></label>
 <label class="fld"><span class="flabel">Fecha</span><input type="date" id="sFecha" value="${s.fecha||maxCorte()}"${s.mode==='fuente'?' disabled':''}></label>
 <label class="fld"><span class="flabel">Próximo a vencer (días antes)</span><input type="number" min="0" max="60" id="sProx" value="${s.prox}" style="width:64px"></label>
 <label class="fld"><span class="flabel">Días de gracia</span><input type="number" min="0" max="60" id="sGr" value="${s.gracia}" style="width:64px"></label>
 <button class="ghost" type="button" id="sHoy">Usar hoy</button><button class="ghost" type="button" id="sRst">Restablecer</button></div>
 <div class="hint" style="margin-top:6px">Cortes de las fuentes: SEZA ${fdate(D.cfg.cortes.SEZA)} · SHIP ${fdate(D.cfg.cortes.SHIP)} · GSG ${fdate(D.cfg.cortes.GSG)}. Valores por defecto en la sección <b>cfg</b> de los datos del tablero.</div></div>`;
}
function wireSem(){
 const g=id=>document.getElementById(id);if(!g('sMode'))return;
 g('sMode').onchange=()=>{st.sem.mode=g('sMode').value;if(st.sem.mode==='fecha'&&!st.sem.fecha)st.sem.fecha=maxCorte();render()};
 g('sFecha').onchange=()=>{st.sem.fecha=g('sFecha').value;render()};
 g('sProx').onchange=()=>{st.sem.prox=Math.max(0,+g('sProx').value||0);render()};
 g('sGr').onchange=()=>{st.sem.gracia=Math.max(0,+g('sGr').value||0);render()};
 g('sHoy').onclick=()=>{st.sem.mode='fecha';st.sem.fecha=new Date().toISOString().slice(0,10);render()};
 g('sRst').onclick=()=>{st.sem={mode:'fuente',fecha:'',prox:D.cfg.diasProximo,gracia:D.cfg.gracia};render()};
}
const CALX={};D.cal.forEach(c=>CALX[c[0]]=c);
const empScope=()=>st.emp==='Global'?['SEZA','SHIP','GSG']:[st.emp];
function calData(){
 const E=empScope(),R=D.cal.map(c=>({c,fact:0,nf:0,pag:0,pen:0,penN:0,rev:0,late:0,sem:null}));const by={};R.forEach(o=>by[o.c[0]]=o);
 const un={fact:0,nf:0,pag:0,pen:0,penN:0,rev:0,sem:{k:'in',l:'Sin fecha de pago',a:null,r:3}};
 const K={er:{n:0,i:0},wr:{n:0,i:0},ok:{n:0,i:0},in:{n:0,i:0}};
 D.calag.filter(a=>E.includes(a[1])).forEach(a=>{
  const o=by[a[0]]||un,s=a[2];o.fact+=a[5];o.nf+=a[4];
  if(s==='Pagada')o.pag+=a[5];else if(s==='Por revisar')o.rev+=a[3];
  else if(s==='Pendiente de pago'){o.pen+=a[5];o.penN+=a[4];const x=a[0]==='Sin asignación'?semPend(null,a[1]):semPend(CALX[a[0]][8],a[1]);K[x.k].n+=a[4];K[x.k].i+=a[5];
   if(o!==un){if(!o.sem||x.r<o.sem.r)o.sem=x;o.late=Math.max(o.late,x.a||0)}}
 });
 return {R,un,K};
}
function vbars(items){
 const W=900,H=230,L=52,B=28,T=10,step=(W-L-8)/(items.length||1),w=Math.min(step*.7,40),hh=H-T-B;
 const mx=Math.max(...items.map(i=>i.parts.reduce((s,p)=>s+p.v,0)),1);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pendiente por fecha tentativa de pago">`;
 [0,.5,1].forEach(f=>{const y=T+hh*(1-f);s+=`<line class="gl" x1="${L}" x2="${W-8}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${money(mx*f)}</text>`});
 items.forEach((it,i)=>{const x=L+i*step+(step-w)/2;let y=H-B;
  it.parts.forEach(p=>{const h=p.v/mx*hh;if(h>0){y-=h;s+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,1)}" fill="${p.c}"/>`}});
  s+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle">${it.lab}</text><rect class="hit" tabindex="0" x="${L+i*step}" y="${T}" width="${step}" height="${hh}" data-tip="Pago tentativo ${it.lab}||${it.parts.filter(p=>p.v>0).map(p=>p.c+'|'+p.n+'|'+money(p.v)).join('||')}"/>`});
 return s+'</svg>';
}
const SEMLAB={er:'Atrasado',wr:'Próximo a vencer',ok:'Dentro del plazo',in:'Sin fecha de pago'};
const SEMC={er:'var(--crit)',wr:'var(--c1)',ok:'var(--good)',in:'var(--noer)'};
function vCal(){
 const {R,un,K}=calData(),E=empScope();
 const latest=maxCorte();
 const tot=Object.values(K).reduce((s,x)=>({n:s.n+x.n,i:s.i+x.i}),{n:0,i:0});
 let h=semParams();
 h+='<section class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">'+SEMF.map(([k,l])=>`<div class="kpi t-${k}"><div class="k">${l}</div><div class="n">${money(K[k].i)}</div><div class="s">${num(K[k].n)} facturas pendientes · ${tot.i?pct(K[k].i/tot.i):'–'}</div></div>`).join('')+'</section>';
 // grafica: pendiente por fecha tentativa de pago
 const M={};D.calag.filter(a=>E.includes(a[1])&&a[2]==='Pendiente de pago'&&a[0]!=='Sin asignación').forEach(a=>{const d=CALX[a[0]][8],x=semPend(d,a[1]);M[d]=M[d]||{er:0,wr:0,ok:0,en:{er:0,wr:0,ok:0}};M[d][x.k]+=a[5];M[d].en[x.k]+=a[4]});
 const ds=Object.keys(M).sort();
 const items=ds.map(d=>({lab:fdate(d).slice(0,5),parts:['er','wr','ok'].map(k=>({v:M[d][k],c:SEMC[k],n:SEMLAB[k]}))}));
 const tbl='<table><tr><th>Fecha tentativa de pago</th><th>Atrasado</th><th>Próximo a vencer</th><th>Dentro del plazo</th></tr>'+ds.map(d=>`<tr><td>${fdate(d)}</td><td>${money(M[d].er)}</td><td>${money(M[d].wr)}</td><td>${money(M[d].ok)}</td></tr>`).join('')+'</table>';
 h+='<div class="grid">'+chartCard('Pendiente por fecha tentativa de pago','Walmart · '+(st.emp==='Global'?'grupo completo':st.emp)+' · importe pendiente según el semáforo',SEMF.slice(0,3).map(([k,l])=>lg(SEMC[k],l)).join(''),vbars(items),tbl,'s12')+'</div>';
 // tabla del calendario
 const fuente=c=>c[9]==='O'?'<span class="badge ok">Oficial</span>':c[9]==='R'?'<span class="badge in">Referencial</span>':'<span class="badge">Proyección</span>';
 const row=o=>{const c=o.c,cur=c[3]<=latest&&latest<=c[4],fut=c[3]>latest&&!o.nf;
  const sm=o.pen>0?o.sem:(o.nf?{k:'ok',l:'Sin pendiente',a:0}:null);
  return `<tr class="${cur?'cur':fut?'fut':''}"><td>${c[2]}${c[9]==='R'?' <span class="badge in">Ref.</span>':c[9]==='P'?' <span class="badge">Proy.</span>':''}${cur?' <span class="badge in">Vigente</span>':''}</td><td>${fdate(c[5])}</td><td>${fdate(c[7])}</td><td>${fdate(c[8])}${c[10]?' †':''}</td><td>${o.nf?num(o.nf):'–'}</td><td>${o.fact?money(o.fact):'–'}</td><td>${o.pag?money(o.pag):'–'}</td><td>${o.pen?money(o.pen):'–'}</td><td>${o.pen?(o.late?num(o.late):'0'):'–'}</td><td>${sm?semBadge(sm):'–'}</td></tr>`};
 const cal=R.map(row).join('')+`<tr><td>Sin periodo asignado</td><td>–</td><td>–</td><td>–</td><td>${un.nf?num(un.nf):'–'}</td><td>${un.fact?money(un.fact):'–'}</td><td>${un.pag?money(un.pag):'–'}</td><td>${un.pen?money(un.pen):'–'}</td><td>–</td><td>${un.pen?semBadge(un.sem):'–'}</td></tr>`;
 h+='<div class="card"><div class="chead"><div><h2>Calendario de cobranza · Walmart</h2><div class="hint">'+(st.emp==='Global'?'Grupo completo':st.emp)+' · periodos de facturación con sus fechas de prefactura, carga y pago. No depende del filtro de meses.</div></div></div><div class="tw tall"><table><tr><th>Periodo</th><th>Prefactura</th><th>Carga de facturas</th><th>Pago tentativo</th><th>Facturas</th><th>Facturado</th><th>Pagado</th><th>Pendiente</th><th>Días de atraso</th><th>Semáforo</th></tr>'+cal+'</table></div>'
  +'<div class="hint" style="margin-top:8px">† Pago recorrido por el congelamiento de cierre financiero ('+D.cfg.congelamientos.map(c=>fdate(c[0])+' al '+fdate(c[1])+', primer lote '+fdate(c[2])).join('; ')+'). Periodos del 27-ago al 31-oct-2026: calendario oficial de Walmart. <b>Ref.</b>: periodo reconstruido por regla, sin calendario oficial. <b>Proy.</b>: proyección. Importes en subtotal.</div></div>';
 return h;
}
const V={res:vRes,emp:vEmp,mm:vMM,cal:vCal,acc:vAcc,nt:vNt};
function mkSeg(el,items,isOn,fn,cls){el.innerHTML='';items.forEach(it=>{const b=document.createElement('button');b.type='button';b.className=cls(it);b.setAttribute('aria-pressed',isOn(it));b.innerHTML=lbl(it);b.onclick=()=>fn(it);el.appendChild(b);if(it[2]!==undefined&&it[2])b.style.setProperty('--co','var('+it[2]+')')})}
const lbl=it=>Array.isArray(it)?(it[2]?'<span class="dot"></span>':'<span class="dot" style="background:#fff"></span>')+it[1]:it;
function render(scroll){
 mkSeg($('fEmp'),EMPS,it=>st.emp===it[0],it=>{st.emp=it[0];render()},it=>'emp'+(it[0]==='Global'?' g':''));
 mkSeg($('fMes'),MES,m=>st.meses.has(m),m=>{if(st.meses.has(m)){if(st.meses.size>1)st.meses.delete(m)}else st.meses.add(m);render()},()=>'chip');
 $('fMes').querySelectorAll('button').forEach((b,i)=>b.innerHTML=MS[MES[i]]);
 const tb=$('tabs');tb.innerHTML='';TABS.forEach(([k,l])=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',st.tab===k);b.textContent=l;b.onclick=()=>{st.tab=k;render(true)};tb.appendChild(b)});
 cid=0;const v=$('view');v.innerHTML=V[st.tab]();wireCards(v);bindTips(v);
 v.querySelectorAll('tr[data-s]').forEach(r=>{const go=()=>{st.drill=st.drill===r.dataset.s?null:r.dataset.s;st.q='';st.cat='';st.sf='';st.page=0;st.sort=st.drill==='Pendiente de pago'?{k:91,dir:1}:{k:7,dir:-1};render();if(st.drill)$('drill').scrollIntoView({block:'start'})};r.onclick=go;r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
 wireDrill();wireSem();
 if(st.tab==='cal'){const c=v.querySelector('.tw.tall'),r=c&&c.querySelector('tr.cur');if(c&&r)c.scrollTop=Math.max(0,r.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-80)}
 v.querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>{st.cliEmp=b.dataset.ce;render()});
 v.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{st.emp=b.dataset.e;render()});
 if(scroll)window.scrollTo(0,0);
}
render();
</script>
